<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SKREK Recovery Map</title>
    <link rel="stylesheet" href="./v2.css">
    <link rel="stylesheet" href="./readiness.css">
    <link rel="stylesheet" href="./product-integration.css?v=version-update-ux-fix">
    <link rel="stylesheet" href="../../src/ui/skrek-global-header.css?v=20260814-hd-logo-v1">
  </head>
  <body>
    <a class="skip-link" href="#app">跳到主要内容</a>
    <header id="site-header" class="global-header-host"></header>
    <div class="map-context"><button id="app-home" aria-label="返回Recovery Map概览"><span>Recovery Map</span><small id="save-state">✓ 当前安全会话内自动保存</small></button></div>
    <nav id="flow-nav" aria-label="Recovery Map流程"></nav>
    <main id="app" tabindex="-1"><section class="card" role="status"><p>正在打开 Recovery Map…</p></section></main>
    <footer>SKREK 不会要求你记录私钥、助记词、OTP、Authenticator Seed 或完整密码。</footer>
    <div id="overlay-root"></div><div id="toast" role="status" aria-live="polite"></div>
    <script src="../account/public-config.js"></script>
    <script src="../account/account-nav-bridge.bundle.js"></script>
    <script id="recovery-map-app" type="module" src="./v2-app.bundle.js?v=live-navigation-initialization-v1"></script>
    <script>
      (()=>{
        const renderFailure=()=>{
          const app=document.querySelector('#app');
          if(!app||!app.textContent.includes('正在打开 Recovery Map'))return;
          app.innerHTML='<section class="card initialization-failure" role="alert"><h1>Recovery Map 未能正常打开</h1><p>请重新加载，或返回客户中心后再次进入。</p><div class="actions"><button id="reload-recovery-map">重新加载</button><a class="button secondary" href="../account/index.html?section=maps#center">返回客户中心</a></div></section>';
          document.querySelector('#reload-recovery-map')?.addEventListener('click',()=>location.reload());
        };
        document.querySelector('#recovery-map-app')?.addEventListener('error',renderFailure);
        setTimeout(renderFailure,12000);
      })();
    </script>
  </body>
</html>
